<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>403 Forbidden — RBAC Policy Enforced</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6">
  <div class="max-w-lg w-full p-6 bg-slate-900 border border-rose-500/40 rounded-2xl space-y-4">
    <span class="px-2.5 py-1 text-xs font-bold bg-rose-500/20 text-rose-300 rounded">HTTP 403 Forbidden • RBAC Enforced</span>
    <h1 class="text-xl font-bold text-white">Access Denied by Backend Permission Check</h1>
    <p class="text-xs text-slate-300 leading-relaxed">
      Your active role (<strong class="text-indigo-300">{{ active_role }}</strong>) is restricted from accessing the
      <code class="text-rose-300">{{ attempted_module }}</code> module.
    </p>
    <a href="{% url 'dashboard:customer_profile' %}" class="inline-block px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold rounded-lg text-white">
      Return to Customer Profile Dashboard
    </a>
  </div>
</body>
</html>
