<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sales Dashboard</title>
    <style>
        table { border-collapse: collapse; width: 50%; margin-top: 20px; }
        th, td { border: 1px solid black; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Module 1: Total Sales Trends</h1>

    <table>
        <tr>
            <th>Sales Year</th>
            <th>Sales Month</th>
            <th>Total Sales ($)</th>
        </tr>
        <!-- This loop unpacks the 'sales_trends' dictionary from views.py -->
        {% for row in sales_trends %}
        <tr>
            <td>{{ row.SalesYear }}</td>
            <td>{{ row.SalesMonth }}</td>
            <td>{{ row.TotalSales }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">No sales data found. Check your database connection.</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
