
<div id="deptReportModal" class="hidden fixed inset-0 z-[9999] flex items-center justify-center bg-slate-950/70 backdrop-blur-sm p-4 print:hidden">
    <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-2xl w-full max-w-lg overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
            <div>
                <h2 class="text-lg font-bold text-slate-900 dark:text-white">Create Custom Report</h2>
                <p class="text-xs text-slate-500 dark:text-slate-400">Configure title, visuals, and notes to generate a clean report.</p>
            </div>
            <button type="button" onclick="closeDeptReportModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xl leading-none">&times;</button>
        </div>

        <div class="p-6 space-y-4 max-h-[82vh] overflow-y-auto">
            <div>
                <label for="deptReportTitle" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">
                    Report Title
                </label>
                <input
                    type="text"
                    id="deptReportTitle"
                    class="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 px-3.5 py-2 text-sm text-slate-800 dark:text-slate-200 focus:border-blue-500 focus:outline-none"
                    placeholder="e.g., Q3 Regional Sales Performance Report">
            </div>

            <div>
                <div class="flex items-center justify-between text-xs mb-1.5">
                    <span class="font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Select Visuals & Tables</span>
                    <div class="space-x-2">
                        <button type="button" onclick="toggleAllDeptWidgets(true)" class="text-blue-600 dark:text-blue-400 hover:underline font-medium">Select All</button>
                        <span class="text-slate-300 dark:text-slate-600">|</span>
                        <button type="button" onclick="toggleAllDeptWidgets(false)" class="text-slate-500 hover:underline">Clear</button>
                    </div>
                </div>

                <div id="deptWidgetChecklist" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                </div>
            </div>

            
            <div>
                <label for="deptReportComments" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">
                    Comments / Notes <span class="normal-case font-normal text-slate-400">(Optional)</span>
                </label>
                <textarea
                    id="deptReportComments"
                    rows="3"
                    class="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 px-3.5 py-2 text-sm text-slate-800 dark:text-slate-200 focus:border-blue-500 focus:outline-none"
                    placeholder="Add executive summary, observations, or context..."></textarea>
            </div>

            
            <div class="rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 px-3.5 py-2.5 text-xs text-slate-600 dark:text-slate-300">
                <span class="font-semibold text-slate-700 dark:text-slate-200">Captured Filters:</span>
                <span id="deptCapturedFiltersPreview">All Data (No filters applied)</span>
            </div>

            
            <div class="pt-2 border-t border-slate-200 dark:border-slate-700">
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" onclick="generateDeptReport('pdf')" class="flex items-center justify-center gap-2 rounded-xl bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-blue-700 transition">
                        Generate PDF
                    </button>
                    <button type="button" onclick="generateDeptReport('csv')" class="flex items-center justify-center gap-2 rounded-xl bg-emerald-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-emerald-700 transition">
                        Export CSV
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="customReportPrintSheet" class="hidden print:block bg-white text-slate-900 p-6 space-y-6"></div>

<style>
    @media print {
        body.custom-report-printing * {
            visibility: hidden;
        }
        body.custom-report-printing #customReportPrintSheet,
        body.custom-report-printing #customReportPrintSheet * {
            visibility: visible;
        }
        body.custom-report-printing #customReportPrintSheet {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            display: block !important;
        }
        .report-print-card {
            break-inside: avoid;
            page-break-inside: avoid;
        }
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const modal = document.getElementById('deptReportModal');
        const printSheet = document.getElementById('customReportPrintSheet');
        if (modal) document.body.appendChild(modal);
        if (printSheet) document.body.appendChild(printSheet);
    });

    function getActivePageFilters() {
        const filters = [];
        const form = document.querySelector('form[method="GET"]');
        if (!form) return ['None'];

        const groups = {};
        form.querySelectorAll('input[type="checkbox"]:checked').forEach(function(cb) {
            const labelText = cb.closest('label') ? cb.closest('label').innerText.trim() : cb.value;
            const groupName = cb.name
                ? cb.name.charAt(0).toUpperCase() + cb.name.slice(1)
                : 'Filter';
            if (!groups[groupName]) groups[groupName] = [];
            groups[groupName].push(labelText);
        });

        Object.keys(groups).forEach(function(key) {
            filters.push(key + ': ' + groups[key].join(', '));
        });

        form.querySelectorAll('select').forEach(function(sel) {
            const lbl = form.querySelector('label[for="' + sel.id + '"]');
            const name = lbl ? lbl.innerText.trim() : (sel.name || 'Option');
            const selectedOption = sel.options[sel.selectedIndex];
            if (selectedOption) {
                filters.push(name + ': ' + selectedOption.text.trim());
            }
        });

        return filters.length > 0 ? filters : ['All Data (No filters applied)'];
    }

    function openDeptReportModal() {
        const pageHeading = document.querySelector('h1');
        const defaultTitle = (pageHeading ? pageHeading.innerText.trim() : 'Department') + ' Report';
        const titleInput = document.getElementById('deptReportTitle');
        if (!titleInput.value.trim()) {
            titleInput.value = defaultTitle;
        }

        const activeFilters = getActivePageFilters();
        document.getElementById('deptCapturedFiltersPreview').innerText = activeFilters.join('  •  ');

        const checklist = document.getElementById('deptWidgetChecklist');
        checklist.innerHTML = '';

        const widgets = document.querySelectorAll('[data-report-widget]');
        widgets.forEach(function(el, index) {
            const title = el.getAttribute('data-report-widget') || ('Section ' + (index + 1));

            const label = document.createElement('label');
            label.className = 'flex items-center gap-3 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/60 hover:border-blue-500 cursor-pointer transition';
            label.innerHTML = `
                <input type="checkbox" data-widget-index="${index}" checked class="rounded border-slate-300 text-blue-600 focus:ring-blue-500 h-4 w-4">
                <span class="text-sm font-medium text-slate-800 dark:text-slate-200">${title}</span>
            `;
            checklist.appendChild(label);
        });

        document.getElementById('deptReportModal').classList.remove('hidden');
    }

    function closeDeptReportModal() {
        document.getElementById('deptReportModal').classList.add('hidden');
    }

    function toggleAllDeptWidgets(state) {
        document.querySelectorAll('#deptWidgetChecklist input[type="checkbox"]').forEach(function(cb) {
            cb.checked = state;
        });
    }

    function generateDeptReport(format) {
        const widgets = document.querySelectorAll('[data-report-widget]');
        const checkboxes = document.querySelectorAll('#deptWidgetChecklist input[type="checkbox"]');
        const selectedWidgets = [];

        checkboxes.forEach(function(cb) {
            const idx = parseInt(cb.getAttribute('data-widget-index'), 10);
            if (cb.checked && widgets[idx]) {
                selectedWidgets.push(widgets[idx]);
            }
        });

        if (selectedWidgets.length === 0) {
            alert('Please select at least one visual or table to include in your report.');
            return;
        }

        const reportTitle = document.getElementById('deptReportTitle').value.trim() || 'Custom Department Report';
        const comments = document.getElementById('deptReportComments').value.trim();
        const activeFilters = getActivePageFilters();

        closeDeptReportModal();

        if (format === 'pdf') {
            buildAndPrintCustomReport(reportTitle, activeFilters, comments, selectedWidgets);
        } else if (format === 'csv') {
            exportCustomReportCSV(reportTitle, activeFilters, comments, selectedWidgets);
        }
    }

    function buildAndPrintCustomReport(title, filters, comments, selectedWidgets) {
        const sheet = document.getElementById('customReportPrintSheet');
        const generatedAt = new Date().toLocaleString();

        let html = `
            <div class="border-b-2 border-slate-900 pb-4 mb-6">
                <div class="flex items-start justify-between gap-4">
                    <div>
                        <p class="text-xs font-bold uppercase tracking-widest text-slate-500">AdventureWorks BI Report</p>
                        <h1 class="text-2xl font-bold text-slate-950 mt-1">${escapeHtml(title)}</h1>
                    </div>
                    <p class="text-xs text-slate-500 text-right">Generated:<br>${escapeHtml(generatedAt)}</p>
                </div>

                <div class="mt-4 rounded-lg bg-slate-100 px-4 py-2.5 text-xs text-slate-700">
                    <span class="font-bold uppercase tracking-wider text-slate-600">Applied Filters:</span>
                    ${escapeHtml(filters.join('  |  '))}
                </div>
        `;

        if (comments) {
            html += `
                <div class="mt-3 rounded-lg border border-slate-300 bg-slate-50 px-4 py-3 text-sm text-slate-800">
                    <p class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Comments / Notes</p>
                    <p class="whitespace-pre-line">${escapeHtml(comments)}</p>
                </div>
            `;
        }

        html += `</div><div class="space-y-6">`;

        selectedWidgets.forEach(function(widget) {
            const widgetName = widget.getAttribute('data-report-widget') || 'Section';
            const canvas = widget.querySelector('canvas');
            const table = widget.querySelector('table');

            html += `<div class="report-print-card border border-slate-300 rounded-xl p-4">`;
            html += `<h3 class="text-sm font-bold uppercase tracking-wider text-slate-800 mb-3">${escapeHtml(widgetName)}</h3>`;

            if (canvas) {
                const imgData = canvas.toDataURL('image/png', 1.0);
                html += `<img src="${imgData}" alt="${escapeHtml(widgetName)}" class="w-full max-h-80 object-contain mx-auto">`;
            } else if (table) {
                const clonedTable = table.cloneNode(true);
                clonedTable.classList.remove('text-xs');
                clonedTable.classList.add('w-full', 'text-left', 'text-xs', 'border-collapse');
                html += clonedTable.outerHTML;
            }

            html += `</div>`;
        });

        html += `</div>`;
        sheet.innerHTML = html;

        document.body.classList.add('custom-report-printing');

        const cleanup = function() {
            document.body.classList.remove('custom-report-printing');
            sheet.innerHTML = '';
            window.removeEventListener('afterprint', cleanup);
        };
        window.addEventListener('afterprint', cleanup);

        setTimeout(function() {
            window.print();
        }, 150);
    }

    function exportCustomReportCSV(title, filters, comments, selectedWidgets) {
        const csvLines = [];
        csvLines.push('"' + title.replace(/"/g, '""') + '"');
        csvLines.push('"Generated: ' + new Date().toLocaleString().replace(/"/g, '""') + '"');
        csvLines.push('"Filters: ' + filters.join(' | ').replace(/"/g, '""') + '"');
        if (comments) {
            csvLines.push('"Comments: ' + comments.replace(/\r?\n/g, ' ').replace(/"/g, '""') + '"');
        }
        csvLines.push('');

        let hasTables = false;
        selectedWidgets.forEach(function(widget) {
            const name = widget.getAttribute('data-report-widget') || 'Section';
            const table = widget.querySelector('table');
            if (table) {
                hasTables = true;
                csvLines.push('"' + name.replace(/"/g, '""') + '"');
                table.querySelectorAll('tr').forEach(function(tr) {
                    const row = [];
                    tr.querySelectorAll('th, td').forEach(function(cell) {
                        const text = cell.innerText.trim().replace(/\s+/g, ' ');
                        row.push('"' + text.replace(/"/g, '""') + '"');
                    });
                    csvLines.push(row.join(','));
                });
                csvLines.push('');
            }
        });

        if (!hasTables) {
            alert('None of the selected visuals contain tabular data for CSV export. Select at least one table or use Generate PDF.');
            return;
        }

        const blob = new Blob([csvLines.join('\n')], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = title.toLowerCase().replace(/[^a-z0-9]+/g, '_') + '.csv';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }
</script>
