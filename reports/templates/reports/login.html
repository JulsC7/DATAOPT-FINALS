<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Sign In | DATAOPT Governance Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
        <div class="flex items-center gap-3 mb-6">
            <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-bold">AW</div>
            <div>
                <h1 class="text-lg font-bold">DATAOPT FINALS</h1>
                <p class="text-xs text-slate-400">Role-Based Data Governance Portal</p>
            </div>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Operator Username</label>
                <input type="text" name="username" value="jakob.limjoco" required
                       class="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-sm focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Select RBAC Security Profile</label>
                <select name="role" class="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-sm focus:outline-none focus:border-blue-500">
                    <option value="admin">Chief Data Officer (Full Access - All 4 Modules)</option>
                    <option value="sales_mgr">Sales & Territory Manager (Modules 1 & 2 Only)</option>
                    <option value="finance_analyst">Financial Risk Analyst (Modules 3 & 4 Only)</option>
                    <option value="viewer">General Auditor (Overview Only - Modules Locked)</option>
                </select>
            </div>

            <button type="submit" class="w-full py-2.5 rounded-lg bg-blue-600 hover:bg-blue-500 font-semibold text-sm transition">
                Authenticate & Enter Portal
            </button>
        </form>
    </div>
</body>
</html>
