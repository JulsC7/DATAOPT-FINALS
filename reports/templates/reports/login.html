<!DOCTYPE html>
<html lang="en" id="html-root" data-palette="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | DATAOPT Governance Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0b1120',
                        cardbg: '#111827',
                    }
                }
            }
        }
    </script>
    <style>
        :root,
        [data-palette="default"] {
            --accent-primary: #2563eb;
            --accent-hover: #1d4ed8;
        }
        html.dark,
        html.dark [data-palette="default"] {
            --accent-primary: #3b82f6;
            --accent-hover: #2563eb;
        }
        .accent-solid {
            background-color: var(--accent-primary);
            color: #ffffff;
        }
        .accent-solid:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-6 transition-colors duration-200">
    <button
        type="button"
        onclick="toggleTheme()"
        class="fixed top-4 right-4 flex items-center gap-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-cardbg px-4 py-2 text-sm font-medium text-slate-700 dark:text-slate-200 shadow-sm hover:border-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
        aria-label="Toggle light or dark mode">
        <span id="theme-indicator" class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
        <span id="theme-text">Light Mode</span>
    </button>

    <main class="w-full max-w-md">
        <section class="bg-white dark:bg-cardbg border border-slate-200 dark:border-slate-700 rounded-2xl p-8 shadow-xl transition-colors duration-200" aria-labelledby="login-heading">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-12 h-12 rounded-xl accent-solid flex items-center justify-center font-bold text-white" aria-hidden="true">
                    AW
                </div>
                <div>
                    <h1 id="login-heading" class="text-xl font-bold text-slate-950 dark:text-white">Sign in</h1>
                    <p class="text-sm text-slate-600 dark:text-slate-300">DATAOPT Governance Portal</p>
                </div>
            </div>

            {% if error %}
                <div class="mb-5 rounded-xl border border-rose-300 dark:border-rose-500/60 bg-rose-50 dark:bg-rose-950/60 px-4 py-3 text-sm text-rose-700 dark:text-rose-200" role="alert">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST" class="space-y-5" novalidate>
                {% csrf_token %}

                <div>
                    <label for="username" class="block text-sm font-semibold text-slate-800 dark:text-slate-100 mb-2">
                        Username
                    </label>
                    <input
                        id="username"
                        type="text"
                        name="username"
                        value="{{ username|default:'' }}"
                        autocomplete="username"
                        required
                        aria-required="true"
                        class="w-full px-4 py-3 rounded-xl bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-base text-slate-950 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        placeholder="Enter your username">
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold text-slate-800 dark:text-slate-100 mb-2">
                        Password
                    </label>
                    <input
                        id="password"
                        type="password"
                        name="password"
                        autocomplete="current-password"
                        required
                        aria-required="true"
                        class="w-full px-4 py-3 rounded-xl bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-base text-slate-950 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        placeholder="Enter your password">
                </div>

                <button
                    type="submit"
                    class="w-full py-3 rounded-xl accent-solid font-semibold text-base transition">
                    Sign in
                </button>
            </form>
        </section>
    </main>

    <script>
        const root = document.getElementById('html-root');
        const themeText = document.getElementById('theme-text');
        const themeIndicator = document.getElementById('theme-indicator');

        function applyTheme(theme) {
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = theme === 'dark' || (theme === 'system' && prefersDark);
            if (isDark) {
                root.classList.add('dark');
                themeText.innerText = 'Dark Mode';
                themeIndicator.classList.remove('bg-amber-400');
                themeIndicator.classList.add('bg-emerald-400');
                localStorage.setItem('aw_theme_mode', 'dark');
            } else {
                root.classList.remove('dark');
                themeText.innerText = 'Light Mode';
                themeIndicator.classList.remove('bg-emerald-400');
                themeIndicator.classList.add('bg-amber-400');
                localStorage.setItem('aw_theme_mode', 'light');
            }
        }

        function toggleTheme() {
            const nextTheme = root.classList.contains('dark') ? 'light' : 'dark';
            applyTheme(nextTheme);
        }

        applyTheme(localStorage.getItem('aw_theme_mode') || 'light');
    </script>
</body>
</html>
